name: Daily Ontario Court Lists Scrape

on:
  schedule:
    # 8:15 AM EST (13:15 UTC during standard time / 12:15 UTC during EDT)
    - cron: '15 12 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Scraper
        # If running from a scheduled cron or manual workflow dispatch, execute full scrape
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python scraper/scraper.py

      - name: Commit and push updated dockets & database
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update court dockets for $(date +'%Y-%m-%d')" && git push)

      - name: Upload Daily Spreadsheets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-dockets-${{ github.sha }}
          path: |
            data/*.xlsx
            data/*.csv
            data/court_dockets.db
          retention-days: 90

  deploy-pages:
    needs: scrape-and-publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Root directory containing index.html and data/
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
