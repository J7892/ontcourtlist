name: Daily Ontario Court Lists Scrape

on:
  schedule:
    # 8:15 AM EST (13:15 UTC during standard time / 12:15 UTC during EDT)
    - cron: '15 12 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Scraper
        run: |
          python scraper/scraper.py

      - name: Commit and push updated dockets & database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update court dockets for $(date +'%Y-%m-%d')" && git push)

      - name: Upload Daily Spreadsheets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-dockets-${{ github.sha }}
          path: |
            data/*.xlsx
            data/*.csv
            data/court_dockets.db
          retention-days: 90
